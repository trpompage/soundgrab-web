server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location = /api {
        proxy_pass https://cobalt-production-90d3.up.railway.app/;
        proxy_set_header Host cobalt-production-90d3.up.railway.app;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    location /tunnel {
        proxy_pass https://cobalt-production-90d3.up.railway.app/tunnel;
        proxy_set_header Host cobalt-production-90d3.up.railway.app;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
